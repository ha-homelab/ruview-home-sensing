# Metadata only: the pinned workflow never checks out or executes PR code.
name: Auto Approve PRs
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Pull request number for reviewed recovery
        required: true
        type: string
      expected-head:
        description: Exact reviewed 40-character head SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: approval-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pull-request-number }}-${{ (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true
jobs:
  auto-approve:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      ((github.event.action != 'edited' || github.event.changes.base) &&
       ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
        (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]'))) &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
       !github.event.pull_request.draft &&
       contains(github.event.pull_request.labels.*.name, 'auto-approve'))
    permissions:
      contents: read
      pull-requests: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@e71559f44e41f39ad0037bf13c7f43bbbb2ec9af
    with:
      runner-labels: '["ubuntu-24.04"]'
      pull-request-number: ${{ inputs.pull-request-number || '' }}
      expected-head: ${{ inputs.expected-head || '' }}
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
