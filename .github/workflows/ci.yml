name: Public validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-boundary:
    name: Public source boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require explicit GitHub-hosted policy
        env:
          RUNNER_MODE: ${{ vars.CI_RUNNER_MODE }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_MODE" = github
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/check-public-boundary.py
      - name: Check real contribution and base history identities
        env:
          HISTORY_EVENT: ${{ github.event_name }}
          HISTORY_REVISION: ${{ github.sha }}
          HISTORY_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HISTORY_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_history_event.py
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/check_workflows.py
  firmware-build:
    name: ESP32-S3 firmware build
    needs: public-boundary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 50
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch hash-verified public firmware sources
        run: python3 firmware/fetch-source.py "$RUNNER_TEMP/firmware-context"
      - name: Build the default ESP32-S3 firmware using the pinned IDF image
        timeout-minutes: 40
        shell: bash
        run: |
          docker build --progress=plain --target artifacts \
            --output "type=local,dest=$RUNNER_TEMP/firmware-artifacts" \
            "$RUNNER_TEMP/firmware-context" 2>&1 | tee "$RUNNER_TEMP/firmware-build.log"
      - name: Verify real firmware outputs and tool provenance
        run: |
          cd "$RUNNER_TEMP/firmware-artifacts"
          sha256sum -c SHA256SUMS.txt
          for path in esp32-csi-node.bin esp32-csi-node.elf esp32-csi-node.map \
            bootloader.bin partition-table.bin ota_data_initial.bin \
            flasher_args.json sdkconfig dependencies.lock compile_commands.json \
            BUILD_TOOLS.txt IDF_TOOLS.json ruview-wifi-policy.json licenses/RuView-LICENSE \
            licenses/Monocypher-LICENCE.md licenses/WASM3-LICENSE licenses/ESP-IDF-LICENSE; do
            test -s "$path"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          import struct
          header = Path("esp32-csi-node.elf").read_bytes()[:20]
          assert header[:6] == b"\x7fELF\x01\x01", "Expected little-endian ELF32"
          assert struct.unpack_from("<H", header, 18)[0] == 94, "Expected Xtensa ELF"
          assert Path("esp32-csi-node.bin").read_bytes()[0] == 0xE9, "Expected ESP firmware image"
          commands = json.loads(Path("compile_commands.json").read_text())
          assert any(row["file"].endswith("/main/wasm_runtime.c") and
                     "-DWASM3_AVAILABLE=1" in row["command"] for row in commands)
          assert any(row["file"].endswith("/monocypher.c") for row in commands)
          policy = json.loads(Path("ruview-wifi-policy.json").read_text())
          assert policy["revision"] == Path("BUILD_TOOLS.txt").read_text().splitlines()[0], \
              "Wi-Fi policy must target the actual compiled SDK"
          assert len(policy["patched_sha256"]) == 64 and len(policy["policy_sha256"]) == 64
          print("Verified linked Xtensa firmware and real WASM3/Monocypher compile inputs")
          PY
      - name: Preserve firmware build outputs and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32s3-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/firmware-artifacts/
            ${{ runner.temp }}/firmware-build.log
          if-no-files-found: error
          retention-days: 7
  collector-build:
    name: Full collector cross-build
    needs: public-boundary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the pinned public collector source
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collector-context" "$RUNNER_TEMP/collector-artifacts"
          python3 collector/prepare-source.py "$RUNNER_TEMP/collector-context/source"
          git -C "$RUNNER_TEMP/collector-context/source" rev-parse HEAD \
            > "$RUNNER_TEMP/collector-artifacts/upstream-commit.txt"
          git -C "$RUNNER_TEMP/collector-context/source" submodule status --recursive \
            > "$RUNNER_TEMP/collector-artifacts/upstream-submodules.txt"
          git -C "$RUNNER_TEMP/collector-context/source" diff --binary \
            > "$RUNNER_TEMP/collector-artifacts/applied-tracked-source.patch"
          # Include copied source modules, which are untracked in the upstream tree.
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "collector-context/source"
          inputs = [
              Path("collector/Dockerfile"),
              Path("collector/prepare-source.py"),
              Path("collector/source-lock.json"),
              Path("collector/ring_policy.py"),
              Path("collector/test_ring_policy.py"),
              Path("scripts/transport_security.py"),
              *sorted(Path("collector/patches").glob("*.patch")),
              *sorted(Path("collector/src").glob("*.rs")),
              *sorted(path for path in Path("collector/ring-policy").rglob("*") if path.is_file()),
          ]
          evidence = {
              "local_inputs": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in inputs
              },
              "prepared_server_sources": {
                  str(path.relative_to(source)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(
                      (source / "v2/crates/wifi-densepose-sensing-server/src").rglob("*.rs")
                  )
              },
              "cargo_lock_sha256": hashlib.sha256(
                  (source / "v2/Cargo.lock").read_bytes()
              ).hexdigest(),
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "collector-artifacts/source-inputs.json"
          output.write_text(json.dumps(evidence, indent=2) + "\n")
          PY
      - name: Run native collector regressions and cross-build the complete ARM64 image
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 --progress=plain \
            --file collector/Dockerfile \
            --tag "ruview-collector-ci:$GITHUB_SHA" \
            "$RUNNER_TEMP/collector-context" 2>&1 \
            | tee "$RUNNER_TEMP/collector-artifacts/build.log"
      - name: Verify the produced image and extract the compiled collector without starting it
        shell: bash
        run: |
          set -euo pipefail
          image="ruview-collector-ci:$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' "$image")" = arm64/linux
          docker image inspect --format '{{.Id}}' "$image" \
            > "$RUNNER_TEMP/collector-artifacts/image-id.txt"
          container="$(docker create --platform linux/arm64 --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/false "$image")"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/sensing-server" \
            "$RUNNER_TEMP/collector-artifacts/sensing-server"
          docker cp "$container:/app/ring-policy-receipt.json" \
            "$RUNNER_TEMP/collector-artifacts/ring-policy-receipt.json"
          docker cp "$container:/app/licenses/ring" \
            "$RUNNER_TEMP/collector-artifacts/ring-licenses"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import struct
          root = Path(os.environ["RUNNER_TEMP"]) / "collector-artifacts"
          binary = (root / "sensing-server").read_bytes()
          if binary[:6] != b"\x7fELF\x02\x01":
              raise SystemExit("Expected a little-endian ELF64 executable")
          if struct.unpack_from("<H", binary, 18)[0] != 183:
              raise SystemExit("Expected an AArch64 executable")
          log = (root / "build.log").read_text(errors="replace")
          counts = [
              int(value)
              for value in re.findall(r"test result: ok\. (\d+) passed; 0 failed;", log)
          ]
          # The current Dockerfile runs six separate named suites. If another
          # required suite is added, increase this minimum in the same change.
          if len(counts) < 6 or any(count == 0 for count in counts):
              raise SystemExit(f"Missing or empty native collector regression suite: {counts}")
          if "Actual ring policy checked:" not in log:
              raise SystemExit("Missing actual compiled ring regression")
          ring_receipt = json.loads((root / "ring-policy-receipt.json").read_text())
          ring_source = json.loads(Path("collector/ring-policy/source.json").read_text())
          if any(ring_receipt.get(key) != value for key, value in ring_source.items()):
              raise SystemExit("Unexpected ring source or policy receipt")
          patch_hash = hashlib.sha256(
              Path("collector/ring-policy/exact-minimum.patch").read_bytes()
          ).hexdigest()
          if ring_receipt.get("patch_sha256") != patch_hash:
              raise SystemExit("Unexpected ring patch digest")
          for name in ring_source["licenses"]:
              if not (root / "ring-licenses" / name.replace("/", "__")).is_file():
                  raise SystemExit(f"Missing delivered ring license: {name}")
          receipt = {
              "image_platform": "linux/arm64",
              "binary_bytes": len(binary),
              "binary_sha256": hashlib.sha256(binary).hexdigest(),
              "native_test_suite_pass_counts": counts,
              "ring_policy_patch_sha256": patch_hash,
              "arm64_runtime_executed": False,
              "hardware_executed": False,
          }
          (root / "build-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
          readelf -h "$RUNNER_TEMP/collector-artifacts/sensing-server" \
            > "$RUNNER_TEMP/collector-artifacts/elf-header.txt"
          readelf -d "$RUNNER_TEMP/collector-artifacts/sensing-server" \
            > "$RUNNER_TEMP/collector-artifacts/dynamic-linkage.txt"
      - name: Preserve collector build outputs and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-build-${{ github.sha }}
          path: ${{ runner.temp }}/collector-artifacts/
          if-no-files-found: error
          retention-days: 7
  bridge-container:
    needs: public-boundary
    # Native ARM64 validates the documented architecture without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and import the bridge in its native ARM64 container
        run: python3 scripts/test-bridge-container.py
  assumed-activity-container:
    needs: public-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and import the activity service in its native AMD64 container
        run: python3 scripts/test-assumed-activity-container.py
  validate:
    needs: public-boundary
    runs-on: ubuntu-24.04
    # Cold compilers and complete native regression suites have a bounded budget.
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: victron-venus/venus-os-ci-toolkit/actions/setup-python@21a366f200f0371a10a6de7ad6ca263af230b842 # shared, immutable
        with:
          python-version: '3.13'
      - name: Install the pinned CMake wheel for host component checks
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-build-tools.txt
      - name: Install the hash-checked public bridge and runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Verify imports use the installed public distribution
        run: python scripts/test-public-adapter-installed.py
      - name: Install synthetic certificate test dependencies
        run: |
          python -m pip install --only-binary=:all: -r tests/requirements-security.txt
      - run: python -m pip install ruff==0.16.5 esp-idf-nvs-partition-gen==0.3.0 esptool==5.1.0
      - run: ruff check bridge.py module_observations.py ruview_http.py scripts tools tests firmware/*.py firmware/tests firmware/fleet firmware/wisp-pilot firmware/wifi-security collector/*.py collector/ui/export-floor-config.py inference server-modules/*.py server-modules/tests assumed_activity radar wisp_pilot
      - run: ruff format --check bridge.py module_observations.py ruview_http.py scripts tools tests firmware/*.py firmware/tests firmware/fleet firmware/wisp-pilot firmware/wifi-security collector/*.py collector/ui/export-floor-config.py inference server-modules/*.py server-modules/tests assumed_activity radar wisp_pilot
      - run: node --test collector/ui/tests/*.test.mjs
      - run: python -m unittest discover -s assumed_activity/tests -v
      - run: python -m unittest discover -s radar/tests -v
      - run: python -m unittest discover -s wisp_pilot/tests -v
      - run: python -m unittest discover -s firmware/wisp-pilot/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s firmware/fleet/tests -v
      - run: python -m pip install -r inference/requirements.txt
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m unittest discover -s inference/tests -v
      - run: python -m unittest discover -s server-modules/tests -v
      - run: python firmware/tests/test_nvs.py -v
      - run: python firmware/fetch-source.py "$RUNNER_TEMP/ruview-firmware"
      - run: python firmware/tests/test_rvf.py "$RUNNER_TEMP/ruview-firmware/source" -v
      - run: python firmware/tests/test_wifi_selection.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: python firmware/tests/test_preferred_ap.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: python firmware/tests/test_runtime_diagnostics.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: python firmware/tests/test_ota_deadlines.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: python firmware/tests/test_http_nodelay.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: python firmware/tests/test_http_status_result.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: python firmware/tests/test_self_ping_recovery.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: python firmware/tests/test_boot_bound_recovery.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: python firmware/tests/test_csi_sequence_admission.py "$RUNNER_TEMP/ruview-firmware/source"
      - run: |
          git init "$RUNNER_TEMP/wasm3"
          git -C "$RUNNER_TEMP/wasm3" remote add origin https://github.com/wasm3/wasm3.git
          git -C "$RUNNER_TEMP/wasm3" fetch --depth 1 origin 6b8bcb1e07bf26ebef09a7211b0a37a446eafd52
          git -C "$RUNNER_TEMP/wasm3" checkout --detach FETCH_HEAD
          python firmware/tests/test_component.py "$RUNNER_TEMP/ruview-firmware/source" "$RUNNER_TEMP/wasm3"
          python firmware/tests/test_alias_safe_words.py "$RUNNER_TEMP/ruview-firmware/source" "$RUNNER_TEMP/wasm3"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # shared toolkit pin
        with:
          toolchain: '1.96.1'
          targets: wasm32-unknown-unknown
      - name: Verify immutable module source profiles
        run: |
          python firmware/fetch-modules.py "$RUNNER_TEMP/ruview-module-pristine" --source-only
          python firmware/tests/test_module_profiles.py "$RUNNER_TEMP/ruview-module-pristine"
      - name: Validate v2 module source and warmup regressions
        env:
          RUSTUP_TOOLCHAIN: 1.96.1
          CARGO_BUILD_JOBS: '4'
        run: |
          python firmware/fetch-modules.py "$RUNNER_TEMP/ruview-home-signal-v2" --profile home-signal-v2
          rustup target add wasm32-unknown-unknown
          cd "$RUNNER_TEMP/ruview-home-signal-v2"
          cargo test --locked --features std --lib
          cargo build --locked --lib --release --target wasm32-unknown-unknown
          python "$GITHUB_WORKSPACE/firmware/tests/test_runtime.py" "$RUNNER_TEMP/ruview-firmware/source" "$RUNNER_TEMP/wasm3" --wasm target/wasm32-unknown-unknown/release/wifi_densepose_wasm_edge.wasm
      - name: Validate incremental v3 module and restart behavior
        env:
          RUSTUP_TOOLCHAIN: 1.96.1
          CARGO_BUILD_JOBS: '4'
        run: |
          python firmware/fetch-modules.py "$RUNNER_TEMP/ruview-home-signal-v3" --profile home-signal-v3
          cd "$RUNNER_TEMP/ruview-home-signal-v3"
          cargo test --locked --features std --lib
          cargo build --locked --lib --release --target wasm32-unknown-unknown
          python "$GITHUB_WORKSPACE/firmware/tests/test_runtime.py" "$RUNNER_TEMP/ruview-firmware/source" "$RUNNER_TEMP/wasm3" --wasm target/wasm32-unknown-unknown/release/wifi_densepose_wasm_edge.wasm --gesture-restart
      - name: Validate two-row v4 module and exact restart warmup
        env:
          RUSTUP_TOOLCHAIN: 1.96.1
          CARGO_BUILD_JOBS: '4'
        run: |
          python firmware/fetch-modules.py "$RUNNER_TEMP/ruview-home-signal-v4" --profile home-signal-v4
          cd "$RUNNER_TEMP/ruview-home-signal-v4"
          cargo test --locked --features std --lib
          cargo build --locked --lib --release --target wasm32-unknown-unknown
          python "$GITHUB_WORKSPACE/firmware/tests/test_runtime.py" "$RUNNER_TEMP/ruview-firmware/source" "$RUNNER_TEMP/wasm3" --wasm target/wasm32-unknown-unknown/release/wifi_densepose_wasm_edge.wasm --gesture-restart --gesture-restart-profile home-signal-v4
      - name: Validate one-row v5 module and exact restart warmup
        env:
          RUSTUP_TOOLCHAIN: 1.96.1
          CARGO_BUILD_JOBS: '4'
        run: |
          python firmware/fetch-modules.py "$RUNNER_TEMP/ruview-home-signal-v5" --profile home-signal-v5
          cd "$RUNNER_TEMP/ruview-home-signal-v5"
          cargo test --locked --features std --lib
          cargo build --locked --lib --release --target wasm32-unknown-unknown
          python "$GITHUB_WORKSPACE/firmware/tests/test_runtime.py" "$RUNNER_TEMP/ruview-firmware/source" "$RUNNER_TEMP/wasm3" --wasm target/wasm32-unknown-unknown/release/wifi_densepose_wasm_edge.wasm --gesture-restart --gesture-restart-profile home-signal-v5
      - run: RUSTUP_TOOLCHAIN=1.96.1 sh collector/test-grid.sh
      - name: Validate native server catalog and bounded UDP/HTTP service
        env:
          RUSTUP_TOOLCHAIN: 1.96.1
          CARGO_BUILD_JOBS: '4'
          RUST_TEST_THREADS: '1'
        run: |
          python server-modules/prepare.py "$RUNNER_TEMP/ruview-server-modules" --source "$RUNNER_TEMP/ruview-module-pristine" --offline
          cd "$RUNNER_TEMP/ruview-server-modules/worker"
          cargo test --manifest-path ../upstream/Cargo.toml --target-dir target --locked --no-default-features --features std --lib sec_tailgating::tests
          cargo test --locked --all-targets
          cargo build --locked --release
          python tests/service_smoke.py target/release/ruview-server-modules "$RUNNER_TEMP/ruview-server-modules-smoke"
          python tests/fleet_service_smoke.py target/release/ruview-server-modules "$RUNNER_TEMP/ruview-fleet-modules-smoke"
          python tests/capture_service_smoke.py target/release/ruview-server-modules "$RUNNER_TEMP/ruview-capture-modules-smoke"
  packages:
    name: Distribution integrity
    needs: public-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: victron-venus/venus-os-ci-toolkit/actions/setup-python@21a366f200f0371a10a6de7ad6ca263af230b842
        with:
          python-version: '3.13'
      - name: Install locked runtime and numerical dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install -r inference/requirements.txt
      - name: Build wheel and verify isolated installed entrypoints
        run: |
          mkdir -p "$RUNNER_TEMP/distributions"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/distributions" .
          python scripts/test-installed-wheel.py "$RUNNER_TEMP"/distributions/*.whl
          python scripts/check-public-boundary.py --archive "$RUNNER_TEMP"/distributions/*.whl
      - name: Build deterministic complete tools archive and scan publication bytes
        run: |
          revision=$(git rev-parse HEAD)
          python scripts/build-release.py --revision "$revision" --output "$RUNNER_TEMP/distributions/ruview-home-sensing-tools.tar.gz"
          python scripts/build-release.py --revision "$revision" --output "$RUNNER_TEMP/second-tools.tar.gz"
          cmp "$RUNNER_TEMP/distributions/ruview-home-sensing-tools.tar.gz" "$RUNNER_TEMP/second-tools.tar.gz"
          python scripts/check-public-boundary.py --archive "$RUNNER_TEMP/distributions/ruview-home-sensing-tools.tar.gz"
      - name: Retain only scanned distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-distributions
          path: ${{ runner.temp }}/distributions/*
          if-no-files-found: error
          retention-days: 7
  enclosure:
    needs: public-boundary
    uses: ./.github/workflows/enclosure-cad.yml
  security:
    needs: public-boundary
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@6b2d99519d513d2b871d2a845ddd6134dea4af2c
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      force-full: true
      languages: python,javascript-typescript,actions
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
  gate:
    name: Public CI gate
    if: ${{ always() }}
    needs: [public-boundary, firmware-build, collector-build, bridge-container, assumed-activity-container, validate, packages, enclosure, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          if failed:
              raise SystemExit(f"Required validation did not succeed: {failed}")
          print("All required public source, runtime, firmware, CAD and security checks passed.")
          PYCODE
