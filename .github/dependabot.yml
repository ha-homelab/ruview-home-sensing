version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Update this independently reviewed composite together with tools/check_workflows.py.
    ignore:
      - dependency-name: "victron-venus/venus-os-ci-toolkit/actions/setup-python"
    groups:
      workflow-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /inference
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /assumed_activity
    schedule:
      interval: weekly
