# Isolated Wisp pilot; copy beside a verified `source/` checkout before use.
# Source: albert-canfield/wisp at 56813ac91a0fe696dae20e1fec468d33fc1e60ed.
# This is a build recipe, not a qualified RuView OTA image.
substitutions:
  node_name: wisp-pilot

esphome:
  name: ${node_name}
  name_add_mac_suffix: true
  min_version: 2026.9.1
  project:
    name: ruview.wisp-pilot
    version: "0.1.20-pilot.1"
  on_boot:
    priority: -100
    then:
      - light.turn_off: pilot_rgb

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: source/firmware/components
    components: [wisp]

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: !secret wifi_bssid
      channel: !secret grid_channel
  power_save_mode: none
  post_connect_roaming: false
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

safe_mode:

wisp:
  id: wisp_node
  ap_ping_interval: 50ms
  raw_stream_port: 47010
  report_interval: 200ms
  grid_channel: !secret grid_channel
  ap_min_rssi: -80
  motion_threshold: 2.0
  ap_csi_rate:
    name: Pilot AP CSI rate
  csi_dropped:
    name: Pilot CSI dropped
  ap_motion_score:
    name: Pilot AP motion score
  grid_nodes:
    name: Pilot grid nodes
  channel:
    name: Pilot grid channel
  hive_in_sync:
    name: Pilot hive in sync

switch:
  - platform: template
    name: Pilot raw CSI stream
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(wisp_node).set_raw_stream_enabled(true);
    on_turn_off:
      - lambda: id(wisp_node).set_raw_stream_enabled(false);

# The documented S3 board has a WS2812 on GPIO48. Verify that physical binding.
# No status interval, identify strobe, or externally exposed light is installed.
light:
  - platform: esp32_rmt_led_strip
    id: pilot_rgb
    internal: true
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

text_sensor:
  - platform: wifi_info
    bssid:
      name: Pilot access point
    mac_address:
      name: Pilot station MAC
