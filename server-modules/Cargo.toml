[package]
name = "ruview-server-modules"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
libc = "=0.2.190"
wifi-densepose-wasm-edge = { path = "../upstream", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[profile.release]
opt-level = 2
codegen-units = 1
lto = "thin"
panic = "unwind"

[workspace]
