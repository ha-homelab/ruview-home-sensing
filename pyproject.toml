[project]
name = "ruview-home-sensing"
version = "0.4.1b3"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
description = "RuView sensing, evidence validation and reproducible hardware tooling"
dependencies = [
  "ruview-home-assistant @ https://github.com/ha-homelab/ruview-home-assistant/releases/download/v0.1.4-beta.1/ruview_home_assistant-0.1.4b1-py3-none-any.whl#sha256=a9cfb4cf663870379c9a025c0e1247470545d57196d1057537b007bc4a8a8ca0",
  "paho-mqtt==2.2.0",
  "websockets==17.4",
]

[project.optional-dependencies]
inference = ["numpy==2.5.4"]

[project.scripts]
ruview-inference = "inference.__main__:main"
ruview-radar = "radar.__main__:main"
ruview-wisp = "wisp_pilot.__main__:main"
ruview-activity = "assumed_activity.service:cli"


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["assumed_activity", "inference", "radar", "wisp_pilot", "scripts"]
exclude = ["*.tests", "*.tests.*"]
namespaces = true

[tool.setuptools]
py-modules = ["bridge", "module_observations", "ruview_http"]
