[project]
name = "ruview-home-sensing"
version = "0.4.0rc2"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
description = "RuView sensing, evidence validation and reproducible hardware tooling"
dependencies = [
  "ruview-home-assistant @ https://github.com/ha-homelab/ruview-home-assistant/releases/download/v0.1.2/ruview_home_assistant-0.1.2-py3-none-any.whl#sha256=702a8c495a6d78bcc37a1df939abe45a416ff10eefabc8eb29213fdbb2efd11b",
  "paho-mqtt==2.1.0",
  "websockets==17.2",
]

[project.optional-dependencies]
inference = ["numpy==2.5.4"]

[project.scripts]
ruview-inference = "inference.__main__:main"
ruview-radar = "radar.__main__:main"
ruview-wisp = "wisp_pilot.__main__:main"
ruview-activity = "assumed_activity.service:cli"


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["assumed_activity", "inference", "radar", "wisp_pilot", "scripts"]
exclude = ["*.tests", "*.tests.*"]
namespaces = true

[tool.setuptools]
py-modules = ["bridge", "module_observations", "ruview_http"]
